# An order at the place (M10, BR-13 to BR-15): find an item on the place's prices, step it into
# the cart, review and place it, and see it among the place's orders, waiting for its approval (decision D86).
appId: com.thelamp.app.e2e
name: order
---
- launchApp:
    stopApp: false
# The previous flow ended on the upload queue, above the tabs; Android's back key leaves it.
- repeat:
    while:
      notVisible:
        id: tab-home
    times: 3
    commands:
      - waitForAnimationToEnd
      - back
# Accounts left the tab bar for More in stage M3 (decision D104).
- tapOn:
    id: tab-me
- tapOn:
    id: more-accounts
- tapOn: ${ACCOUNT}
- scrollUntilVisible:
    element: New order
    centerElement: true
- tapOn: New order
- extendedWaitUntil:
    visible: Search items or codes
    timeout: 20000
- tapOn: Search items or codes
- inputText: ${ITEM_CODE}
- pressKey: Enter
# Three, a step at a time (stage M4, decision D104).
- repeat:
    times: 3
    commands:
      - tapOn: More Maestro Seeds 1 kg.*
# 3 at ₹200 with 5% tax: ₹600 taxable on the cart bar, ₹630 in all on the review.
- tapOn: 'Review: 1 item, ₹600.00 \+ GST'
- scrollUntilVisible:
    element: '₹630.00'
# Placing waits for a location fix, as a visit does.
- extendedWaitUntil:
    visible:
      text: 'Place the order · ₹630.00'
      enabled: true
    timeout: 45000
- tapOn: 'Place the order · ₹630.00'
- scrollUntilVisible:
    element: Orders here
    timeout: 30000
# Placed online it shows once the phone syncs it back; queued, it waits to send.
- scrollUntilVisible:
    element: 'Waiting · ₹630.00|Waiting to send'
    timeout: 60000
