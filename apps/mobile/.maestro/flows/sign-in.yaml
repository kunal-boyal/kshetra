# A field user signs in with the code sent to their number (M1).
appId: com.thelamp.app.e2e
name: sign-in
---
- launchApp:
    clearState: true
    permissions:
      all: allow
# The number field takes focus at once, and the keyboard covers the button below it.
- extendedWaitUntil:
    visible: Mobile number.*
    timeout: 60000
- inputText: ${PHONE}
- hideKeyboard
- tapOn: Send code
- extendedWaitUntil:
    visible: Use a different number
    timeout: 20000
- retry:
    maxRetries: 5
    commands:
      - runScript:
          file: ../scripts/read-code.js
          env:
            MAILPIT: ${MAILPIT}
            TO: ${PHONE_E164_DIGITS}@otp.local
# The code field takes focus by itself too.
- inputText: ${output.code}
- hideKeyboard
# The title says Sign in as well; the button is the second.
- tapOn:
    text: Sign in
    index: 1
- extendedWaitUntil:
    visible: Start day
    timeout: 30000
