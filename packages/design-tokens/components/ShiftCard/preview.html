<!-- @dsCard group="Field" height=250 subtitle="Start day, on duty, end day" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShiftCard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>html,body{margin:0}</style>
</head>
<body>
<div class="ks ks-pv ks-phone" data-density="comfortable">
 <div class="ks-card raised ks-shift">
  <div class="ks-spread"><span class="ks-shift-state"><span class="ks-live"></span> On duty since 09:12</span><span class="ks-badge success">Tracking</span></div>
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px"><div><div class="ks-shift-time">5 h 48 min</div><div class="ks-meta">on duty</div></div><div><div class="ks-shift-time">38.4 km</div><div class="ks-meta">travelled, about</div></div><div><div class="ks-shift-time">6</div><div class="ks-meta">visits</div></div></div>
  <div class="ks-actions"><button class="ks-btn secondary"><svg class="ks-icon " viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg> Pause</button><button class="ks-btn tonal"><svg class="ks-icon " viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg> End day</button></div>
  <p class="ks-meta">Location is recorded only while you are on duty.</p>
 </div>
</div>
</body>
</html>
