<!-- @dsCard group="Navigation" height=670 subtitle="App bar, cart bar, icon buttons, choosers, the code boxes, tiles and the stepper on the phone" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PhoneParts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>html,body{margin:0}</style>
</head>
<body>
<div class="ks ks-pv" style="display:flex;flex-direction:column;gap:16px;max-width:390px">
 <header style="display:flex;align-items:center;gap:4px;padding:8px 16px 8px 8px">
  <a href="#" aria-label="Back to the visit" style="display:grid;place-items:center;width:44px;height:44px;color:var(--text)"><svg class="ks-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
  <div style="flex:1;min-width:0"><h1 class="heading-md" style="margin:0">New order</h1><p class="ks-meta">Shree Krishna Agro Traders · Dealer prices</p></div>
  <button type="button" aria-label="Inbox, 3" style="position:relative;display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:var(--radius-full);background:none;color:var(--text)"><svg class="ks-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg><span class="ks-count" aria-hidden="true" style="left:auto;right:2px;top:4px">3</span></button>
 </header>
 <div class="ks-chips" role="radiogroup" aria-label="Category" style="padding:0 16px">
  <button type="button" role="radio" aria-checked="true" class="ks-btn primary sm">All</button>
  <button type="button" role="radio" aria-checked="false" class="ks-btn secondary sm">Fertilisers</button>
  <button type="button" role="radio" aria-checked="false" class="ks-btn secondary sm">Seeds</button>
 </div>
 <div class="ks-seg" role="radiogroup" aria-label="When" style="margin:0 16px;display:flex">
  <button type="button" aria-pressed="true" style="flex:1">Today</button>
  <button type="button" aria-pressed="false" style="flex:1">This week</button>
  <button type="button" aria-pressed="false" style="flex:1">This month</button>
 </div>
 <div style="display:flex;flex-direction:column;gap:4px;padding:0 16px">
  <p class="label-md" style="margin:0">Code sent by SMS to +91•••••43210</p>
  <div style="display:flex;gap:8px" aria-hidden="true"><span style="flex:1;display:grid;place-items:center;min-height:56px;border-radius:var(--radius-md);background:var(--surface);border:1px solid var(--border-strong)" class="heading-md ks-num">4</span><span style="flex:1;display:grid;place-items:center;min-height:56px;border-radius:var(--radius-md);background:var(--surface);border:1px solid var(--border-strong)" class="heading-md ks-num">8</span><span style="flex:1;display:grid;place-items:center;min-height:56px;border-radius:var(--radius-md);background:var(--surface);border:1px solid var(--border-strong)" class="heading-md ks-num">2</span><span style="flex:1;display:grid;place-items:center;min-height:56px;border-radius:var(--radius-md);background:var(--surface);border:2px solid var(--accent);box-shadow:0 0 0 3px var(--accent-subtle)"></span><span style="flex:1;display:grid;place-items:center;min-height:56px;border-radius:var(--radius-md);background:var(--surface);border:1px solid var(--border-strong)"></span><span style="flex:1;display:grid;place-items:center;min-height:56px;border-radius:var(--radius-md);background:var(--surface);border:1px solid var(--border-strong)"></span></div>
  <p class="ks-meta">The code fills itself in when the SMS arrives.</p>
 </div>
 <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 16px">
  <a href="#" class="ks-card tint hue-mint" style="display:flex;align-items:center;gap:10px;padding:12px;text-decoration:none;color:inherit"><span class="ks-ico sm"><svg class="ks-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12zM12 11.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"></path></svg></span><span class="label-md">Unplanned visit</span></a>
  <a href="#" class="ks-card tint hue-lilac" style="display:flex;align-items:center;gap:10px;padding:12px;text-decoration:none;color:inherit"><span class="ks-ico sm"><svg class="ks-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3v4M16 3v4M3 9h18M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"></path></svg></span><span class="label-md">Ask for leave</span></a>
 </div>
 <div class="ks-item" style="align-items:center;margin:0 16px">
  <span class="ks-ico hue-sage" aria-hidden="true"><svg class="ks-icon" viewBox="0 0 24 24"><path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5zM3 7.5l9 4.5 9-4.5M12 12v9"></path></svg></span>
  <span class="ks-item-main"><span class="ks-title" style="display:block">NPK 19:19:19</span><span class="ks-meta ks-num">1 kg bag · ₹142</span></span>
  <span style="display:inline-flex;align-items:stretch;height:44px;border:1px solid var(--border-strong);border-radius:var(--radius-md);overflow:hidden">
   <button type="button" aria-label="Fewer NPK 19:19:19" style="width:40px;border:0;background:var(--surface);color:var(--text);font:inherit;font-size:18px">−</button>
   <button type="button" aria-label="Quantity of NPK 19:19:19, 40" class="label-lg ks-num" style="min-width:40px;border:0;background:var(--surface);color:var(--text);font-weight:700">40</button>
   <button type="button" aria-label="More NPK 19:19:19" style="width:40px;border:0;background:var(--accent-subtle);color:var(--accent-subtle-fg);font:inherit;font-size:18px">+</button>
  </span>
 </div>
 <a href="#" style="margin:0 12px;display:flex;align-items:center;gap:12px;min-height:56px;padding:0 16px;border-radius:var(--radius-md);background:var(--accent);color:var(--on-accent);text-decoration:none;box-shadow:var(--shadow-md)">
  <span class="label-md" style="font-weight:600">4 items</span>
  <span class="label-lg ks-num" style="flex:1">₹19,780 <span class="caption" style="opacity:.85">+ GST</span></span>
  <span class="label-md" style="font-weight:600">Review</span>
  <svg class="ks-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
 </a>
 <div style="display:flex;gap:12px;padding:12px 16px;background:var(--surface);border-top:1px solid var(--border)">
  <button type="button" class="ks-btn secondary" style="flex:1">Save draft</button>
  <button type="button" class="ks-btn primary" style="flex:1">Submit</button>
 </div>
</div>
</body>
</html>
