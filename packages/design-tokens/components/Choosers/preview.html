<!-- @dsCard group="Forms" height=230 subtitle="Filter chips, a segmented pill and tabs" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choosers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>html,body{margin:0}</style>
</head>
<body>
<div class="ks ks-pv" data-density="compact">
 <div class="ks-stack" style="gap:var(--space-4);max-width:640px">
  <div class="ks-chips" role="group" aria-label="Status"><button type="button" class="ks-btn sm primary" aria-pressed="true">Waiting <span class="ks-chip-count">· 14</span></button><button type="button" class="ks-btn sm secondary" aria-pressed="false">With flags <span class="ks-chip-count">· 5</span></button><button type="button" class="ks-btn sm secondary" aria-pressed="false">Approved</button><button type="button" class="ks-btn sm ghost">More filters</button></div>
  <div class="ks-seg" role="group" aria-label="View"><button type="button" aria-pressed="true">Live</button><button type="button" aria-pressed="false">Day replay</button><button type="button" aria-pressed="false">Visit density</button></div>
  <div class="ks-tablist" role="tablist" aria-label="Account types"><button type="button" role="tab" aria-selected="true">Retailers <span class="ks-chip-count">· 1,443</span></button><button type="button" role="tab" aria-selected="false" tabindex="-1">Distributors <span class="ks-chip-count">· 86</span></button><button type="button" role="tab" aria-selected="false" tabindex="-1">Farmers</button></div>
 </div>
</div>
</body>
</html>
