<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>html,body{margin:0}</style>
</head>
<body>
<div class="ks ks-pv" data-density="compact">
 <div class="ks-pv-row">
  <button class="ks-btn primary">Approve and next</button>
  <button class="ks-btn secondary">Reject</button>
  <button class="ks-btn ghost">Copy previous month</button>
  <button class="ks-btn danger">Reset device</button>
  <button class="ks-btn secondary sm">Export</button>
  <button class="ks-btn primary" disabled>Lock targets</button>
 </div>
 <div class="ks-pv-row" style="margin-top:12px" data-density="comfortable">
  <button class="ks-btn primary lg"><svg class="ks-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="m6 3 14 9-14 9z"/></svg> Start day</button>
  <button class="ks-btn secondary lg"><svg class="ks-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/></svg> Add photo</button>
 </div>
</div>
</body>
</html>
