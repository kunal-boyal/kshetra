<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SyncBanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

</head>
<body>
<div class="ks" style="background:var(--bg);padding-bottom:8px">
 <div class="ks-banner pending"><svg class="ks-icon ks-bob" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 13v8M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.2"/><path d="m8 17 4-4 4 4"/></svg> <span>Uploading 3 of 7. Keep the app open.</span><button class="ks-banner-act">View</button></div>
 <div class="ks-banner danger"><svg class="ks-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.7 18-8-14a2 2 0 0 0-3.5 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3z"/><path d="M12 9v4M12 17h.01"/></svg> <span>2 items were refused. Retry or discard them.</span><button class="ks-banner-act">Open</button></div>
 <div class="ks-banner info"><svg class="ks-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg> <span>Support access as The Lamp Support until 18:00.</span></div>
</div>
</body>
