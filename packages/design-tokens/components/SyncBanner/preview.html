<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SyncBanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>html,body{margin:0}</style>
</head>
<body>
<div class="ks" style="background:var(--bg)">
 <div class="ks-banner pending"><svg class="ks-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="m2 2 20 20"/><path d="M5.8 5.8A7 7 0 0 0 9 19h8.5a4.5 4.5 0 0 0 1.3-.2"/><path d="M21.5 16.5A4.5 4.5 0 0 0 17.5 10h-1.8A7 7 0 0 0 9.4 5.1"/></svg> <span>Offline. 7 items saved on this phone.</span><button class="ks-banner-act">View</button></div>
 <div class="ks-banner danger" style="margin-top:8px"><svg class="ks-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="m21.7 18-8-14a2 2 0 0 0-3.5 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3z"/><path d="M12 9v4M12 17h.01"/></svg> <span>2 items were refused. Retry or discard them.</span><button class="ks-banner-act">Open</button></div>
 <div class="ks-banner info" style="margin-top:8px"><svg class="ks-icon " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg> <span>Support access as Kshetra Support until 18:00.</span></div>
</div>
</body>
</html>
