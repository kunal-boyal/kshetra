<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TextField</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

<div class="ks ks-pv" data-density="comfortable" style="max-width:360px">
 <div class="ks-stack">

  <div class="ks-field"><label class="ks-label">Stock of Hybrid Maize 900M (bags) <span class="req">*</span></label><input class="ks-input num invalid" value=""><span class="ks-help error">Enter a count, 0 or more.</span></div>
 </div>
</div>
