<!-- @dsCard group="Forms" height=170 subtitle="A compact choice in a bar, and a select" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>html,body{margin:0}</style>
</head>
<body>
<div class="ks ks-pv" data-density="compact">
 <div class="ks-row" style="gap:var(--space-2);flex-wrap:wrap">
  <span class="ks-picker"><svg class="ks-icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg><select class="ks-input" aria-label="Language"><option lang="en">English</option><option lang="hi">हिन्दी</option></select></span>
  <span class="ks-picker"><svg class="ks-icon sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg><select class="ks-input" aria-label="Theme"><option>Light</option><option>Dark</option><option>High contrast</option></select></span>
 </div>
 <div class="ks-field" style="margin-top:var(--space-4);max-width:280px"><label class="ks-label">Designation</label><select class="ks-input"><option>Area sales manager</option><option>Sales officer</option></select></div>
</div>
</body>
</html>
