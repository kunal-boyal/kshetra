<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PeriodStepper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>html,body{margin:0}</style>
</head>
<body>
<div class="ks ks-pv" data-density="compact">
 <div class="ks-row" style="gap:var(--space-3)">
  <div class="ks-period" role="group" aria-label="Month"><button type="button" aria-label="Previous month"><svg class="ks-icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button><output>October 2026</output><button type="button" aria-label="Next month" disabled><svg class="ks-icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button></div>
  <div class="ks-period" role="group" aria-label="महीना" lang="hi"><button type="button" aria-label="पिछला महीना"><svg class="ks-icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button><output>सितंबर 2026</output><button type="button" aria-label="अगला महीना"><svg class="ks-icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button></div>
 </div>
</div>
</body>
</html>
