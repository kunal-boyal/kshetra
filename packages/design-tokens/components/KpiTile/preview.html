<!-- @dsCard group="Data" height=212 subtitle="Actual against target, pending apart" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KpiTile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>html,body{margin:0}</style>
</head>
<body>
<div class="ks ks-pv" data-density="compact">
 <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;max-width:760px">
  <div class="ks-kpi"><div class="ks-kpi-head"><span class="ks-ico sm hue-sky"><svg class="ks-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12M6 8h12M6 13l8.5 8M6 13h3M9 13c6.7 0 6.7-10 0-10"/></svg></span><p class="ks-kpi-label">Sales value</p></div><p class="ks-kpi-value" data-count="842300" data-format="inr">₹8,42,300</p><div class="ks-bar"><i class="done" style="width:68%"></i><i class="pend" style="width:9%"></i></div><div class="ks-kpi-foot"><span><b>68%</b> of ₹12,40,000</span><span class="pend">+₹1,12,000 pending</span></div></div>
  <div class="ks-kpi"><div class="ks-kpi-head"><span class="ks-ico sm hue-peach"><svg class="ks-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m2 7 4.4-4.4A2 2 0 0 1 7.8 2h8.4a2 2 0 0 1 1.4.6L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20v3a2 2 0 0 1-2 2 2.7 2.7 0 0 1-4 0 2.7 2.7 0 0 1-4 0 2.7 2.7 0 0 1-4 0 2.7 2.7 0 0 1-4 0 2 2 0 0 1-2-2z"/></svg></span><p class="ks-kpi-label">Retailer visits</p></div><p class="ks-kpi-value" data-count="184">184</p><div class="ks-bar"><i class="done" style="width:92%"></i><i class="pend" style="width:4%"></i></div><div class="ks-kpi-foot"><span><b>92%</b> of 200</span><span class="pend">+8 pending</span></div></div>
  <div class="ks-kpi"><div class="ks-kpi-head"><span class="ks-ico sm hue-mint"><svg class="ks-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg></span><p class="ks-kpi-label">Farmer meetings</p></div><p class="ks-kpi-value" data-count="3">3</p><div class="ks-bar"></div><div class="ks-kpi-foot"><span>No target set</span><span></span></div></div>
 </div>
</div>
<script>
// Count up each [data-count] figure once, as on first view; reduced motion shows the final figure.
function countUp(root) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const ms = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--duration-celebrate')) || 700;
  const inr = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 });
  const plain = new Intl.NumberFormat('en-IN');
  root.querySelectorAll('[data-count]').forEach((el) => {
    const end = Number(el.dataset.count), fmt = el.dataset.format === 'inr' ? inr : plain, start = performance.now();
    const tick = (now) => {
      const t = Math.min(1, (now - start) / ms);
      el.textContent = fmt.format(Math.round(end * (1 - Math.pow(1 - t, 4))));
      if (t < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}
countUp(document);
</script>
</body>
</html>
