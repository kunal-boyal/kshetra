<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KpiTile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>html,body{margin:0}</style>
</head>
<body>
<div class="ks ks-pv" data-density="compact">
 <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;max-width:760px">
  <div class="ks-kpi"><p class="ks-kpi-label">Sales value</p><p class="ks-kpi-value">₹8,42,300</p><div class="ks-bar"><i class="done" style="width:68%"></i><i class="pend" style="width:9%"></i></div><div class="ks-kpi-foot"><span><b>68%</b> of ₹12,40,000</span><span class="pend">+₹1,12,000 pending</span></div></div>
  <div class="ks-kpi"><p class="ks-kpi-label">Retailer visits</p><p class="ks-kpi-value">184</p><div class="ks-bar"><i class="done" style="width:92%"></i><i class="pend" style="width:4%"></i></div><div class="ks-kpi-foot"><span><b>92%</b> of 200</span><span class="pend">+8 pending</span></div></div>
  <div class="ks-kpi"><p class="ks-kpi-label">Farmer meetings</p><p class="ks-kpi-value">3</p><div class="ks-bar"></div><div class="ks-kpi-foot"><span>No target set</span><span></span></div></div>
 </div>
</div>
</body>
</html>
