<!-- @dsCard group="Status" height=156 subtitle="A status word with its colour" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StatusBadge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>html,body{margin:0}</style>
</head>
<body>
<div class="ks ks-pv">
 <div class="ks-pv-row">
  <span class="ks-badge success">Approved</span>
  <span class="ks-badge pending">Pending</span>
  <span class="ks-badge waiting">Step 2 of 3</span>
  <span class="ks-badge info">Planned</span>
  <span class="ks-badge danger">Rejected</span>
  <span class="ks-badge neutral">Cancelled</span>
 </div>
 <div class="ks-pv-row" style="margin-top:12px">
  <span class="ks-badge success">Present</span>
  <span class="ks-badge waiting">Partially accepted</span>
  <span class="ks-badge info">Visited</span>
  <span class="ks-badge danger">Absent</span>
  <span class="ks-badge neutral">Auto-closed</span>
 </div>
 <div class="ks-pv-row" lang="hi" style="margin-top:12px">
  <span class="ks-badge success">स्वीकृत</span>
  <span class="ks-badge pending">लंबित</span>
  <span class="ks-badge waiting">चरण 2/3</span>
  <span class="ks-badge info">नियोजित</span>
  <span class="ks-badge danger">अस्वीकृत</span>
  <span class="ks-badge neutral">रद्द</span>
 </div>
</div>
</body>
</html>
