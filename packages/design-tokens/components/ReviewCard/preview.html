<!-- @dsCard group="Review" height=330 subtitle="Evidence on one card" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ReviewCard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>html,body{margin:0}</style>
</head>
<body>
<div class="ks ks-pv" data-density="compact">
 <div class="ks-card raised" style="max-width:720px">
  <div class="ks-spread"><div><p class="ks-title">Retailer visit · v3</p><p class="ks-meta">Asha Verma · Kisan Seva Kendra</p></div><span class="ks-badge pending">Pending</span></div>
  <div class="ks-review" style="margin-top:12px">
   <div class="ks-stack">
    <dl class="ks-dl"><dt>Captured</dt><dd>30 Sep, 10:42</dd><dt>Received</dt><dd>30 Sep, 14:05</dd><dt>GPS</dt><dd>±18 m · 640 m from account</dd><dt>Stock (bags)</dt><dd>42</dd><dt>Order intent</dt><dd>₹25,000</dd></dl>
    <div class="ks-pv-row"><span class="ks-flag"><svg class="ks-icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg> Outside geofence · 640 m</span><span class="ks-flag"><svg class="ks-icon sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg> Gallery photo</span></div>
    <div class="ks-photos"><div class="ks-photo"><svg class="ks-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/></svg></div><div class="ks-photo"><svg class="ks-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/></svg></div><div class="ks-photo"><svg class="ks-icon " viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg><span class="ks-photo-tag">Gallery</span></div></div>
   </div>
   <div class="ks-mapbox"><svg viewBox="0 0 200 150" width="100%" height="150" aria-label="Map: submission 640 m outside the 300 m geofence">
     <circle cx="70" cy="80" r="40" style="fill:var(--map-geofence);fill-opacity:var(--opacity-geofence);stroke:var(--map-geofence);stroke-width:1.5"/>
     <circle cx="70" cy="80" r="5" style="fill:var(--text)"/>
     <circle cx="160" cy="40" r="7" style="fill:var(--map-outside);stroke:var(--surface);stroke-width:2"/>
     <line x1="70" y1="80" x2="160" y2="40" style="stroke:var(--text-subtle);stroke-dasharray:3 3"/></svg></div>
  </div>
  <div class="ks-spread" style="margin-top:16px"><span class="ks-meta">A approve · R reject · J next</span><div class="ks-row"><button class="ks-btn secondary">Reject</button><button class="ks-btn primary">Approve and next</button></div></div>
 </div>
</div>
</body>
</html>
