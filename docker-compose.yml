# Local services (spec 14.1). Start with `docker compose up -d`.
name: kshetra

services:
  postgres:
    build: infra/docker/postgres
    image: kshetra-postgres:18
    environment:
      POSTGRES_USER: kshetra
      POSTGRES_PASSWORD: kshetra-local
      POSTGRES_DB: kshetra
    ports:
      # 5433 by default, so a PostgreSQL already installed on the machine can keep 5432.
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/18.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kshetra -d kshetra']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.10
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # inbox at http://localhost:8025

volumes:
  postgres-data:
