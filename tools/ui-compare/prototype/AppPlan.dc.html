<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Field app: today's beat plan</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/thelamp/tokens.css">
<link rel="stylesheet" href="ds/thelamp/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--accent)}a:hover{color:var(--accent-hover)}
</style>
</helmet>
<div data-theme="{{theme}}" class="ks" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg); color: var(--text); overflow: hidden; font-family: var(--font-sans);">
  <header style="padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 12px;">
    <div class="ks-spread">
      <h1 class="heading-lg" style="margin: 0;">Beat plan</h1>
      <span class="ks-badge success">Approved</span>
    </div>
    <div style="display: flex; gap: 8px;" role="tablist" aria-label="Day">
      <button type="button" role="tab" aria-selected="false" class="ks-btn secondary sm" style="flex: 1;">Thu 22</button>
      <button type="button" role="tab" aria-selected="true" class="ks-btn primary sm" style="flex: 1;">Today</button>
      <button type="button" role="tab" aria-selected="false" class="ks-btn secondary sm" style="flex: 1;">Sat 24</button>
    </div>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 12px;">
    <div class="ks-mapbox" style="height: 168px; position: relative;" role="img" aria-label="Map of today's eight stops around Sanwer, with the route walked so far">
      <svg viewBox="0 0 358 168" width="100%" height="168" aria-hidden="true" style="display: block;">
        <path d="M0 40h358M0 96h358M0 140h358M70 0v168M180 0v168M290 0v168" style="stroke: var(--chart-grid); stroke-width: 1; fill: none;"></path>
        <path d="M30 140 L80 110 L120 120 L170 80 L210 92" style="stroke: var(--map-route); stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round;"></path>
        <path d="M210 92 L250 60 L300 70 L330 34" style="stroke: var(--map-route); stroke-width: 3; fill: none; stroke-dasharray: 6 6; opacity: .6;"></path>
        <circle cx="80" cy="110" r="7" style="fill: var(--map-inside);"></circle>
        <circle cx="120" cy="120" r="7" style="fill: var(--map-inside);"></circle>
        <circle cx="170" cy="80" r="7" style="fill: var(--map-inside);"></circle>
        <circle cx="210" cy="92" r="9" style="fill: var(--surface); stroke: var(--accent); stroke-width: 4;"></circle>
        <circle cx="250" cy="60" r="7" style="fill: var(--surface); stroke: var(--border-strong); stroke-width: 2;"></circle>
        <circle cx="300" cy="70" r="7" style="fill: var(--surface); stroke: var(--border-strong); stroke-width: 2;"></circle>
        <circle cx="330" cy="34" r="7" style="fill: var(--surface); stroke: var(--border-strong); stroke-width: 2;"></circle>
      </svg>
      <span class="ks-badge neutral" style="position: absolute; left: 8px; top: 8px; background: var(--surface);">Sanwer · 8 stops · 26 km</span>
    </div>

    <div class="ks-list">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="8">
        <a href="AppVisit.dc.html" class="ks-item" style="text-decoration: none; color: inherit;">
          <span class="ks-seq {{it.hue}}">{{it.n}}</span>
          <span class="ks-item-main">
            <span class="ks-title" style="display: block;">{{it.name}}</span>
            <span class="ks-meta">{{it.meta}}</span>
          </span>
          <span class="ks-badge {{it.tone}}">{{it.status}}</span>
        </a>
      </sc-for>
    </div>
    <a class="ks-btn secondary block" href="AppVisit.dc.html" style="text-decoration: none;">
      <svg class="ks-icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      Add an unplanned visit
    </a>
  </main>
  <dc-import name="PhoneTabs" current="plan" hint-size="390px,68px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark","outdoor"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      theme: this.props.theme ?? 'light',
      items: [
        { n: '1', name: 'Shree Krishna Agro Traders', meta: 'Distributor · 9:40 · order taken', status: 'Done', tone: 'success', hue: 'hue-mint' },
        { n: '2', name: 'Ramesh Yadav', meta: 'Farmer · Khedi village · 10:35', status: 'Done', tone: 'success', hue: 'hue-mint' },
        { n: '3', name: 'Om Sai Fertilisers', meta: 'Retailer · 11:50', status: 'In review', tone: 'pending', hue: 'hue-butter' },
        { n: '4', name: 'Patel Krishi Kendra', meta: 'Retailer · 1.2 km away', status: 'Next', tone: 'info', hue: 'hue-sky' },
        { n: '5', name: 'Farmer meeting, Dharawara', meta: 'Meeting · planned 3:00', status: 'Planned', tone: 'neutral', hue: '' },
        { n: '6', name: 'Maa Annapurna Beej Bhandar', meta: 'Retailer · 4.6 km', status: 'Planned', tone: 'neutral', hue: '' },
        { n: '7', name: 'Sunil Patidar', meta: 'Farmer · Bhagora village', status: 'Planned', tone: 'neutral', hue: '' },
        { n: '8', name: 'Kisan Seva Kendra', meta: 'Retailer · 7.1 km', status: 'Planned', tone: 'neutral', hue: '' }
      ]
    };
  }
}
</script>
</body>
</html>
