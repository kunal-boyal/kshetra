<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Portal: people</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/thelamp/tokens.css">
<link rel="stylesheet" href="ds/thelamp/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--accent)}a:hover{color:var(--accent-hover)}
</style>
</helmet>
<div data-theme="{{theme}}" class="ks" style="display: flex; flex-wrap: wrap; min-height: 1100px; background: var(--bg); color: var(--text); font-family: var(--font-sans);">
  <div style="flex: 1 1 248px; background: var(--nav-bg); border-right: 1px solid var(--border);">
    <dc-import name="WebRail" current="people" hint-size="248px,1100px"></dc-import>
  </div>
  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column;">
    <header class="ks-appbar">
      <div class="ks-appbar-org"><span class="ks-ico sm hue-sage">GV</span><span>Green Valley Agro</span></div>
      <div class="ks-appbar-tools">
        <div class="ks-affix" style="width: 260px; max-width: 100%;"><span><svg class="ks-icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"></path></svg></span><input class="ks-input" placeholder="Search people, accounts, orders" aria-label="Search" style="height: 40px; padding-left: 40px;"></div>
        <button type="button" class="ks-btn ghost sm">हिंदी</button>
        <span class="ks-ico sm round hue-lilac" title="Arjun Mehta, Admin">AM</span>
      </div>
    </header>
    <main style="padding: 24px; display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 1240px; box-sizing: border-box;">
      <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px;">
        <div>
          <h1 class="heading-xl" style="margin: 0;">People</h1>
          <p class="ks-meta" style="font-size: 15px;">53 people · 46 active · 41 seats used of 50</p>
        </div>
        <div class="ks-row">
          <a href="WebImports.dc.html" class="ks-btn secondary sm" style="text-decoration: none;">Import from a file</a>
          <button type="button" class="ks-btn primary sm">Add a person</button>
        </div>
      </div>
      <div class="ks-row" style="flex-wrap: wrap;">
        <button type="button" class="ks-btn primary sm" aria-pressed="true">Active · 46</button>
        <button type="button" class="ks-btn secondary sm" aria-pressed="false">Invited · 3</button>
        <button type="button" class="ks-btn secondary sm" aria-pressed="false">Inactive · 4</button>
        <span style="flex: 1;"></span>
        <button type="button" class="ks-btn ghost sm">Designation: all</button>
        <button type="button" class="ks-btn ghost sm">Territory: all</button>
      </div>
      <div style="overflow-x: auto;">
        <table class="ks-table">
          <thead><tr><th>Name</th><th>Designation</th><th>Territory</th><th>Reports to</th><th>Mobile</th><th>Phone</th><th>Status</th></tr></thead>
          <tbody>
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
              <tr>
                <td><span class="ks-row"><span class="ks-ico sm round {{r.hue}}">{{r.ini}}</span><span style="font-weight: 600;">{{r.name}}</span></span></td>
                <td>{{r.role}}</td><td>{{r.where}}</td><td>{{r.boss}}</td><td class="ks-num">{{r.phone}}</td><td>{{r.device}}</td>
                <td><span class="ks-badge {{r.tone}}">{{r.status}}</span></td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
      <div class="ks-row" style="justify-content: center;"><button type="button" class="ks-btn secondary sm">Load more</button></div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const R = (ini, name, role, where, boss, phone, device, status, tone, hue) => ({ ini, name, role, where, boss, phone, device, status, tone, hue });
    return {
      theme: this.props.theme ?? 'light',
      rows: [
        R('VS', 'Vikram Singh', 'Business Head', 'All zones', '—', '98•••• •1101', 'Web only', 'Active', 'success', 'hue-butter'),
        R('NS', 'Neha Sharma', 'ASM', 'Indore region', 'Vikram Singh', '98•••• •4410', 'Galaxy M34', 'Active', 'success', 'hue-rose'),
        R('KJ', 'Kavita Joshi', 'TM', 'Indore city', 'Neha Sharma', '97•••• •2290', 'Redmi Note 13', 'Active', 'success', 'hue-sky'),
        R('RK', 'Ravi Kumar', 'SME', 'Sanwer', 'Neha Sharma', '98•••• •3210', 'Nothing Phone (2a)', 'Active', 'success', 'hue-sage'),
        R('AP', 'Anil Patidar', 'SME', 'Hatod', 'Neha Sharma', '99•••• •7781', 'Vivo Y28', 'Active', 'success', 'hue-peach'),
        R('SM', 'Sneha Malviya', 'SME', 'Gautampura', 'Kavita Joshi', '93•••• •0045', 'Galaxy A15', 'Active', 'success', 'hue-lilac'),
        R('DC', 'Deepak Chouhan', 'SME', 'Depalpur', 'Kavita Joshi', '70•••• •8812', 'Realme C65', 'Active', 'success', ''),
        R('PR', 'Pooja Rathore', 'SME', 'Mhow', 'Neha Sharma', '62•••• •5520', 'Moving to a new phone', 'Phone reset', 'waiting', ''),
        R('MV', 'Manish Verma', 'SO', 'Dewas road', 'Neha Sharma', '88•••• •6634', 'Not signed in yet', 'Invited', 'info', ''),
        R('AM', 'Arjun Mehta', 'Admin', 'All zones', 'Vikram Singh', '98•••• •2345', 'Web only', 'Active', 'success', 'hue-lilac')
      ]
    };
  }
}
</script>
</body>
</html>
