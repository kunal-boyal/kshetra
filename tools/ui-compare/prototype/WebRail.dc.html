<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Portal rail</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/thelamp/tokens.css">
<link rel="stylesheet" href="ds/thelamp/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--accent)}a:hover{color:var(--accent-hover)}
</style>
</helmet>
<nav class="ks-rail ks" aria-label="Portal" style="width: 248px; min-height: 1100px; box-sizing: border-box; border-right: 0; font-family: var(--font-sans);">
  <a class="ks-rail-brand" href="Main.dc.html" style="text-decoration: none;">
    <img src="/_blob/8e7252d2b801bb56a30b72ecdf47be35" alt="" width="32" height="32">
    <span>The Lamp</span>
  </a>
  <sc-for list="{{sections}}" as="s" hint-placeholder-count="5">
    <div class="ks-rail-section">
      <div class="ks-rail-label">{{s.label}}</div>
      <sc-for list="{{s.links}}" as="l" hint-placeholder-count="4">
        <a class="ks-rail-link" href="{{l.href}}" aria-current="{{l.current}}">
          <svg class="ks-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="{{l.d}}"></path></svg>
          <span style="flex: 1;">{{l.label}}</span>
          <sc-if value="{{l.count}}" hint-placeholder-val="{{false}}"><span class="ks-badge neutral" style="min-height: 20px; padding: 0 8px;">{{l.count}}</span></sc-if>
          <sc-if value="{{l.phase}}" hint-placeholder-val="{{false}}"><span title="Built in {{l.phaseName}}" style="font-size: 11px; line-height: 16px; font-weight: 700; padding: 0 6px; border-radius: 9999px; background: var(--surface-sunken); color: var(--text-muted);">{{l.phase}}</span></sc-if>
        </a>
      </sc-for>
    </div>
  </sc-for>
  <div class="ks-rail-foot ks-rail-section">
    <a class="ks-rail-link" href="WebSettings.dc.html" aria-current="{{settingsCurrent}}">
      <svg class="ks-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0M16 4v4M10 10v4M18 16v4"></path></svg>
      <span>Settings</span>
    </a>
  </div>
</nav>
</x-dc>

</body>
</html>
