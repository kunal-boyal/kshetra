<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Field app: team review</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/thelamp/tokens.css">
<link rel="stylesheet" href="ds/thelamp/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--accent)}a:hover{color:var(--accent-hover)}
</style>
</helmet>
<div data-theme="{{theme}}" class="ks" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg); color: var(--text); overflow: hidden; font-family: var(--font-sans);">
  <header style="padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 12px;">
    <div class="ks-spread">
      <div>
        <h1 class="heading-lg" style="margin: 0;">Team</h1>
        <p class="ks-meta">Neha Sharma · ASM · 14 people</p>
      </div>
      <a href="AppApprovals.dc.html" class="ks-btn tonal sm" style="text-decoration: none;">Approvals · 4</a>
    </div>
    <div role="tablist" aria-label="Team views" style="display: flex; padding: 4px; gap: 4px; border-radius: 12px; background: var(--surface-sunken);">
      <button type="button" role="tab" aria-selected="true" style="flex: 1; min-height: 40px; border: 0; border-radius: 8px; background: var(--surface); color: var(--text); font: inherit; font-size: 14px; font-weight: 600; box-shadow: var(--shadow-sm);">Review · 6</button>
      <button type="button" role="tab" aria-selected="false" style="flex: 1; min-height: 40px; border: 0; border-radius: 8px; background: transparent; color: var(--text-muted); font: inherit; font-size: 14px; font-weight: 600;">On duty · 11</button>
      <button type="button" role="tab" aria-selected="false" style="flex: 1; min-height: 40px; border: 0; border-radius: 8px; background: transparent; color: var(--text-muted); font: inherit; font-size: 14px; font-weight: 600;">Plans · 2</button>
    </div>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 12px;">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
      <article class="ks-card" style="display: flex; flex-direction: column; gap: 10px; padding: 14px;">
        <div style="display: flex; gap: 10px; align-items: center;">
          <span class="ks-ico sm round {{c.hue}}">{{c.initials}}</span>
          <div style="flex: 1; min-width: 0;">
            <p class="label-md" style="margin: 0; font-weight: 600;">{{c.person}} · {{c.form}}</p>
            <p class="ks-meta">{{c.where}}</p>
          </div>
        </div>
        <div class="ks-photos">
          <div class="ks-photo hue-sage" style="background: var(--ks-hue-bg);" role="img" aria-label="Photo"><svg class="ks-icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18l5-6 4 4 3-3 6 5M3 6h18v12H3z"></path></svg></div>
          <div class="ks-photo hue-sand" style="background: var(--ks-hue-bg);" role="img" aria-label="Photo"><svg class="ks-icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18l5-6 4 4 3-3 6 5M3 6h18v12H3z"></path></svg></div>
          <p class="ks-meta" style="flex: 1; align-self: center;">{{c.summary}}</p>
        </div>
        <sc-if value="{{c.flag}}" hint-placeholder-val="{{false}}">
          <div class="ks-row" style="flex-wrap: wrap;"><span class="ks-flag">{{c.flag}}</span></div>
        </sc-if>
        <div class="ks-actions">
          <button type="button" class="ks-btn secondary sm">Send back</button>
          <button type="button" class="ks-btn primary sm">Approve</button>
        </div>
      </article>
    </sc-for>
    <p class="ks-meta" style="text-align: center;">Clean visits approve themselves after 48 hours.</p>
  </main>
  <dc-import name="PhoneTabs" current="team" hint-size="390px,68px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark","outdoor"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      theme: this.props.theme ?? 'light',
      cards: [
        { initials: 'RK', hue: 'hue-sage', person: 'Ravi Kumar', form: 'Retailer visit', where: 'Om Sai Fertilisers · today 11:50', summary: 'Stock low on NPK 19:19:19. Display set up.', flag: null },
        { initials: 'AP', hue: 'hue-peach', person: 'Anil Patidar', form: 'Farmer meeting', where: 'Hatod village · today 10:05', summary: '38 farmers, soybean. Demo of GV-Grow.', flag: 'Outside geofence · 420 m' },
        { initials: 'SM', hue: 'hue-lilac', person: 'Sneha Malviya', form: 'Farmer visit', where: 'Gautampura · yesterday 4:40', summary: 'Maize seed trial booked for 2 acres.', flag: 'Photo taken 9 min before check-in' }
      ]
    };
  }
}
</script>
</body>
</html>
