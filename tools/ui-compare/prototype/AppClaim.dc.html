<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Field app: expense claim</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/thelamp/tokens.css">
<link rel="stylesheet" href="ds/thelamp/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--accent)}a:hover{color:var(--accent-hover)}
</style>
</helmet>
<div data-theme="{{theme}}" class="ks" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg); color: var(--text); overflow: hidden; font-family: var(--font-sans);">
  <header style="display: flex; align-items: center; gap: 4px; padding: 8px 16px 8px 8px;">
    <a href="AppMore.dc.html" aria-label="Back to More" style="display: grid; place-items: center; width: 44px; height: 44px; color: var(--text);">
      <svg class="ks-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="flex: 1; min-width: 0;">
      <h1 class="heading-md" style="margin: 0;">October expenses</h1>
      <p class="ks-meta">Draft · 4 bills</p>
    </div>
    <span class="ks-badge neutral">Draft</span>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 14px;">
    <div class="ks-list">
      <sc-for list="{{lines}}" as="l" hint-placeholder-count="4">
        <div class="ks-item" style="align-items: flex-start;">
          <span class="ks-photo {{l.hue}}" style="width: 48px; height: 48px; background: var(--ks-hue-bg); color: var(--ks-hue-fg);" role="img" aria-label="{{l.photo}}"><svg class="ks-icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"></path></svg></span>
          <span class="ks-item-main" style="display: flex; flex-direction: column; gap: 2px;">
            <span class="label-md" style="font-weight: 600;">{{l.what}}</span>
            <span class="ks-meta">{{l.when}}</span>
            <sc-if value="{{l.flag}}" hint-placeholder-val="{{false}}"><span class="ks-flag" style="align-self: flex-start; margin-top: 4px;">{{l.flag}}</span></sc-if>
          </span>
          <span class="numeric" style="font-weight: 600;">{{l.amount}}</span>
        </div>
      </sc-for>
    </div>
    <button type="button" class="ks-btn secondary block">
      <svg class="ks-icon sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      Add a bill
    </button>

    <div class="ks-card ks-spread">
      <span class="label-lg">Claim total</span>
      <span class="metric-md">₹2,140</span>
    </div>

    <section class="ks-card" aria-labelledby="route" style="display: flex; flex-direction: column; gap: 12px;">
      <h2 id="route" class="ks-title">After you send it</h2>
      <ol class="ks-steps">
        <li class="ks-step"><span class="ks-node"></span><div><p class="label-md" style="margin: 0; font-weight: 600;">Neha Sharma · ASM</p><p class="ks-meta">Checks the bills. The phone bill needs her yes.</p></div></li>
        <li class="ks-step"><span class="ks-node"></span><div><p class="label-md" style="margin: 0; font-weight: 600;">Accounts team</p><p class="ks-meta">Pays with the November salary.</p></div></li>
      </ol>
    </section>
  </main>
  <div style="padding: 12px 16px 16px; border-top: 1px solid var(--border); background: var(--surface);">
    <a class="ks-btn primary lg block" href="AppMore.dc.html" style="text-decoration: none;">Send claim · ₹2,140</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark","outdoor"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      theme: this.props.theme ?? 'light',
      lines: [
        { what: 'Fuel', when: '19 Oct · bill photo', amount: '₹640', hue: 'hue-sand', photo: 'Fuel bill', flag: null },
        { what: 'Meals at the farmer meeting', when: '15 Oct · under ₹200, no bill needed', amount: '₹180', hue: 'hue-peach', photo: 'No bill', flag: null },
        { what: 'Courier of seed samples', when: '12 Oct · bill photo', amount: '₹320', hue: 'hue-sky', photo: 'Courier bill', flag: null },
        { what: 'Phone bill', when: '5 Oct · bill photo', amount: '₹1,000', hue: 'hue-lilac', photo: 'Phone bill', flag: '₹500 over the monthly limit' }
      ]
    };
  }
}
</script>
</body>
</html>
