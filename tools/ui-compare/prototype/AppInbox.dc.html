<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Field app: notifications</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/thelamp/tokens.css">
<link rel="stylesheet" href="ds/thelamp/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--accent)}a:hover{color:var(--accent-hover)}
</style>
</helmet>
<div data-theme="{{theme}}" class="ks" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--bg); color: var(--text); overflow: hidden; font-family: var(--font-sans);">
  <header style="display: flex; align-items: center; gap: 4px; padding: 8px 8px 4px;">
    <a href="AppHome.dc.html" aria-label="Back to Home" style="display: grid; place-items: center; width: 44px; height: 44px; color: var(--text);">
      <svg class="ks-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 class="heading-lg" style="margin: 0; flex: 1;">Notifications</h1>
    <button type="button" class="ks-btn ghost sm">Mark all read</button>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 16px;">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 8px;">
        <h2 class="label-sm ks-muted" style="margin: 0; text-transform: uppercase; letter-spacing: .06em;">{{g.label}}</h2>
        <div class="ks-list">
          <sc-for list="{{g.items}}" as="n" hint-placeholder-count="3">
            <a href="{{n.href}}" class="ks-item" style="align-items: flex-start; text-decoration: none; color: inherit; background: {{n.bg}};">
              <span class="ks-ico sm {{n.hue}}"><svg class="ks-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="{{n.d}}"></path></svg></span>
              <span class="ks-item-main" style="display: flex; flex-direction: column; gap: 2px;">
                <span class="label-md" style="font-weight: 600;">{{n.title}}</span>
                <span class="ks-meta">{{n.body}}</span>
                <span class="caption ks-subtle">{{n.when}}</span>
              </span>
              <sc-if value="{{n.unread}}" hint-placeholder-val="{{false}}"><span aria-label="Unread" style="width: 10px; height: 10px; margin-top: 6px; border-radius: 9999px; background: var(--accent); flex: none;"></span></sc-if>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-for>
    <div class="ks-notice"><span>Quiet hours are on from 9 pm to 7 am. Urgent messages still come through.</span></div>
  </main>
  <dc-import name="PhoneTabs" current="home" hint-size="390px,68px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark","outdoor"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const D = {
      back: 'M9 14l-4-4 4-4M5 10h9a5 5 0 0 1 0 10h-2',
      check: 'M5 12.5l4.5 4.5L19 7.5',
      plan: 'M8 3v4M16 3v4M3 9h18M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z',
      truck: 'M3 6h11v10H3zM14 10h4l3 3v3h-7M7 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM17 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4z',
      target: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',
      wallet: 'M4 7h15a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a2 2 0 0 1 2-2h11v3'
    };
    const N = (o) => Object.assign({ unread: null, bg: 'transparent' }, o, o.unread ? { bg: 'var(--accent-subtle)' } : {});
    return {
      theme: this.props.theme ?? 'light',
      groups: [
        { label: 'Today', items: [
          N({ title: 'Visit sent back', body: 'Neha Sharma: retake the shelf photo at Om Sai Fertilisers.', when: '1:42 pm', href: 'AppForm.dc.html', d: D.back, hue: 'hue-peach', unread: true }),
          N({ title: 'Leave approved', body: 'Casual leave on 2 Nov, approved by Neha Sharma.', when: '11:05 am', href: 'AppLeave.dc.html', d: D.check, hue: 'hue-mint', unread: true }),
          N({ title: 'Order dispatched', body: 'Order 1187 for Shree Krishna Agro Traders left the depot.', when: '10:20 am', href: 'AppOrderReview.dc.html', d: D.truck, hue: 'hue-sky' })
        ] },
        { label: 'Earlier', items: [
          N({ title: 'November beat plan sent', body: 'Waiting for Neha Sharma. 23 working days, 164 stops.', when: 'Yesterday', href: 'AppPlan.dc.html', d: D.plan, hue: 'hue-sage' }),
          N({ title: 'Targets locked for October', body: 'Farmer visits 180, order value ₹10 L.', when: '1 Oct', href: 'AppMonth.dc.html', d: D.target, hue: 'hue-butter' }),
          N({ title: 'Payment due', body: 'Patel Krishi Kendra has ₹12,000 overdue since 18 Sep.', when: '21 Oct', href: 'AppCollect.dc.html', d: D.wallet, hue: 'hue-rose' })
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
