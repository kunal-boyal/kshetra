# Dependabot (decision D100): alerts and security updates are on for the repository; these are the
# monthly version updates. Every update waits two weeks after its release (`cooldown`), as the
# project's rule for new versions has it, and lands only through a pull request with `pnpm verify`.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Expo pins its native modules; they move with an SDK upgrade (`expo install --check`).
    # Majors the project holds back on purpose wait for a decision (docs/versions.md): TypeScript
    # until typescript-eslint supports 7, Jest with Expo's, Sentry at 10 (decision D98).
    ignore:
      - dependency-name: 'expo*'
      - dependency-name: '@expo/*'
      - dependency-name: 'react-native*'
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'jest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@jest/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@sentry/*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories: [/apps/api, /infra/docker/postgres]
    schedule:
      interval: monthly
    cooldown:
      default-days: 14

  - package-ecosystem: terraform
    directories:
      [/infra/environments/staging, /infra/environments/production, /infra/environments/demo]
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
