# One environment's deploy (spec 14.3): the image for the commit, the cell (migration, services,
# a watch of its alarms), then the web portal. The GitHub environment holds the variables that
# Terraform's github_variables output lists; AWS is reached by OIDC, with no stored keys.
name: Deploy an environment

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      ref:
        type: string
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      # Images are tagged with the commit, whatever names it here.
      - name: Name the image
        run: echo "IMAGE=${{ vars.ECR_REPOSITORY_URL }}:$(git rev-parse HEAD)" >>"$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Is the image built already?
        id: image
        run: |
          if aws ecr describe-images --repository-name "${ECR_REPOSITORY_URL#*/}" \
              --image-ids imageTag="${IMAGE##*:}" >/dev/null 2>&1; then
            echo "built=true" >>"$GITHUB_OUTPUT"
          fi
        env:
          ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      - if: steps.image.outputs.built != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.image.outputs.built != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}
          provenance: false
      - name: Deploy the cell
        run: infra/scripts/deploy-cell.sh
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          TASK_FAMILY_PREFIX: ${{ vars.TASK_FAMILY_PREFIX }}
          TASK_SUBNETS: ${{ vars.TASK_SUBNETS }}
          TASK_SECURITY_GROUP: ${{ vars.TASK_SECURITY_GROUP }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the web portal
        run: pnpm --filter @thelamp/web build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
      - name: Publish the web portal
        run: infra/scripts/publish-web.sh
        env:
          WEB_BUCKET: ${{ vars.WEB_BUCKET }}
          WEB_DISTRIBUTION_ID: ${{ vars.WEB_DISTRIBUTION_ID }}
      # The platform console, once the environment has its domain (decision D88).
      - name: Build the platform console
        if: vars.CONSOLE_BUCKET != ''
        run: pnpm --filter @thelamp/console build
      - name: Publish the platform console
        if: vars.CONSOLE_BUCKET != ''
        run: infra/scripts/publish-web.sh
        env:
          DIST: apps/console/dist
          WEB_BUCKET: ${{ vars.CONSOLE_BUCKET }}
          WEB_DISTRIBUTION_ID: ${{ vars.CONSOLE_DISTRIBUTION_ID }}
