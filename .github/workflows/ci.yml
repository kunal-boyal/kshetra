# Checks (spec 14.3), lean enough for GitHub's free minutes on a private repository (decisions
# D75 and D92): pull requests and merges to main run the quick checks only; integration, end-to-end,
# the image and Terraform run on main nightly when something merged that day, or by hand on any
# branch; static analysis and the dependency audit run every night (D100). Before each merge the full suite runs locally (`pnpm verify`) and its result goes in the
# pull request.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 02:30 in India.
    - cron: '0 21 * * *'
  workflow_dispatch:

# Every job only reads the repository.
permissions:
  contents: read

concurrency:
  # A merge never cancels the nightly run.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # Static analysis and known advisories (decision D100) run every night, changed or not, as the
  # rules and the advisories move on without us.
  semgrep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.180.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: tools/semgrep/scan.sh

  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Reviewed exceptions are `auditConfig` in pnpm-workspace.yaml.
      - run: pnpm audit --audit-level high

  # The nightly run goes ahead only when main changed in the last day.
  changed:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      recent: ${{ steps.log.outputs.recent }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 50
      - id: log
        run: echo "recent=$(git log -1 --since='25 hours ago' --format=%h)" >> "$GITHUB_OUTPUT"

  integration:
    needs: changed
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changed.outputs.recent != '')
    # Testcontainers builds infra/docker/postgres and runs the API's tests against it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:int

  e2e:
    needs: changed
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changed.outputs.recent != '')
    # Playwright with axe against the web app's production build (spec 14.4).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @thelamp/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  image:
    needs: changed
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changed.outputs.recent != '')
    # The cell's container image builds (decision D67); deploys push it, pull requests only build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  infra:
    needs: changed
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changed.outputs.recent != '')
    # Terraform is formatted and valid for every environment, and the deploy scripts pass
    # ShellCheck; nothing is planned or applied here (decision D67).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
      - run: terraform fmt -recursive -check infra
      - run: |
          for environment in infra/environments/*/; do
            terraform -chdir="$environment" init -backend=false -input=false
            terraform -chdir="$environment" validate
          done
      - run: shellcheck infra/scripts/*.sh
