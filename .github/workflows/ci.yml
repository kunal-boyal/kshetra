# Pull-request checks (spec 14.3). Integration, contract, end-to-end and OpenAPI checks join as
# the code they cover lands.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  integration:
    # Testcontainers builds infra/docker/postgres and runs the API's tests against it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:int

  e2e:
    # Playwright with axe against the web app's production build (spec 14.4).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kshetra/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  image:
    # The cell's container image builds (decision D67); deploys push it, pull requests only build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  infra:
    # Terraform is formatted and valid for every environment, and the deploy scripts pass
    # ShellCheck; nothing is planned or applied here (decision D67).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.0
      - run: terraform fmt -recursive -check infra
      - run: |
          for environment in infra/environments/*/; do
            terraform -chdir="$environment" init -backend=false -input=false
            terraform -chdir="$environment" validate
          done
      - run: shellcheck infra/scripts/*.sh
