# The field app's end-to-end flows (spec 14.4, decision D68): Maestro on an Android emulator,
# against the API and its services running on the runner. By hand only: a run takes about 40 of
# GitHub's free minutes, so it runs before a release or after changes to the flows (decision D75).
# Locally, apps/mobile/.maestro/run.sh runs them on an emulator or a phone.
name: Maestro

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: maestro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flows:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # The runner's disk can't hold the app build, the services and an emulator image together
      # (the first run stopped with "No space left on device"); tools this job never uses make room.
      # The Android NDK stays, as the app's native modules build with it.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell \
            /usr/local/julia* /opt/az /usr/local/lib/android/sdk/system-images
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: pnpm install --frozen-lockfile

      - name: Start the services and the API
        run: |
          cp .env.example .env
          sed -i 's/^OTP_PROVIDER=.*/OTP_PROVIDER=mailpit/' .env
          # The emulator reaches this runner at 10.0.2.2, over a network its airplane mode cuts.
          sed -i 's|^CELL_API_URL=.*|CELL_API_URL=http://10.0.2.2:3000|' .env
          docker compose up -d --wait
          pnpm db:bootstrap
          pnpm db:migrate
          pnpm --filter @thelamp/api build
          cd apps/api
          nohup node --env-file=../../.env dist/main.mjs >../../api.log 2>&1 &
          nohup node --env-file=../../.env dist/worker.mjs >../../worker.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/ready && break
            sleep 2
          done
          pnpm --filter @thelamp/api e2e:fixtures

      - name: Build the e2e app
        working-directory: apps/mobile
        env:
          APP_VARIANT: e2e
          EXPO_PUBLIC_DIRECTORY_URL: http://10.0.2.2:3000
        run: |
          pnpm exec expo prebuild --platform android --no-install
          # Prebuild rewrites the package's scripts; the build needs none of it. The JavaScript is
          # bundled inside the Gradle build, which reads EXPO_PUBLIC_DIRECTORY_URL from this step.
          git checkout -- package.json
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
          # Only the APK is needed from here on.
          rm -rf app/build/intermediates app/build/tmp build
          df -h /

      # A pinned release, checked against its published digest, never a script piped to a shell.
      - name: Install Maestro
        env:
          MAESTRO_VERSION: 2.11.0
          MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
        run: |
          curl -fsSLo maestro.zip "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          echo "$MAESTRO_SHA256  maestro.zip" | sha256sum --check
          unzip -q maestro.zip -d "$HOME/.maestro-cli"
          rm maestro.zip
          echo "$HOME/.maestro-cli/maestro/bin" >>"$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the flows on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: apps/mobile/.maestro/run.sh apps/mobile/android/app/build/outputs/apk/release/app-release.apk

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro
          path: |
            ~/.maestro/tests
            api.log
            worker.log
          retention-days: 14

      - if: failure() && github.event_name != 'pull_request'
        name: Open an issue
        # Values reach the shell as variables, never spliced into the script.
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --title "Maestro flows failed on $REF_NAME" \
            --body "The $EVENT_NAME run failed: $RUN_URL. Its screenshots and logs are in the run's artifacts."
