# The field app's end-to-end flows (spec 14.4, decision D68): Maestro on an Android emulator,
# against the API and its services running on the runner. On main, every night, by hand, and on
# pull requests that change the flows; a failure on main or at night opens an issue.
name: Maestro

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 20 * * *' # 02:00 in India
  workflow_dispatch:
  pull_request:
    paths:
      - apps/mobile/.maestro/**
      - .github/workflows/maestro.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: maestro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flows:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # The runner's disk can't hold the app build, the services and an emulator image together
      # (the first run stopped with "No space left on device"); tools this job never uses make room.
      # The Android NDK stays, as the app's native modules build with it.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell \
            /usr/local/julia* /opt/az /usr/local/lib/android/sdk/system-images
          df -h /
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: pnpm install --frozen-lockfile

      - name: Start the services and the API
        run: |
          cp .env.example .env
          sed -i 's/^OTP_PROVIDER=.*/OTP_PROVIDER=mailpit/' .env
          # The emulator reaches this runner at 10.0.2.2, over a network its airplane mode cuts.
          sed -i 's|^CELL_API_URL=.*|CELL_API_URL=http://10.0.2.2:3000|' .env
          docker compose up -d --wait
          pnpm db:bootstrap
          pnpm db:migrate
          pnpm --filter @thelamp/api build
          cd apps/api
          nohup node --env-file=../../.env dist/main.mjs >../../api.log 2>&1 &
          nohup node --env-file=../../.env dist/worker.mjs >../../worker.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/ready && break
            sleep 2
          done
          pnpm --filter @thelamp/api e2e:fixtures

      - name: Build the e2e app
        working-directory: apps/mobile
        env:
          APP_VARIANT: e2e
          EXPO_PUBLIC_DIRECTORY_URL: http://10.0.2.2:3000
        run: |
          pnpm exec expo prebuild --platform android --no-install
          # Prebuild rewrites the package's scripts; the build needs none of it. The JavaScript is
          # bundled inside the Gradle build, which reads EXPO_PUBLIC_DIRECTORY_URL from this step.
          git checkout -- package.json
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
          # Only the APK is needed from here on.
          rm -rf app/build/intermediates app/build/tmp build
          df -h /

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >>"$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: apps/mobile/.maestro/run.sh apps/mobile/android/app/build/outputs/apk/release/app-release.apk

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro
          path: |
            ~/.maestro/tests
            api.log
            worker.log
          retention-days: 14

      - if: failure() && github.event_name != 'pull_request'
        name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Maestro flows failed on ${{ github.ref_name }}" \
            --body "The ${{ github.event_name }} run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Its screenshots and logs are in the run's artifacts."
